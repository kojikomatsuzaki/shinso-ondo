version_history:
  - version: 3.1.0
    date: '2026-07-27'
    changes:
      ja:
        - スキーマおよび統制語彙を別ファイルへ分離
        - metadata_model.referencesを追加
        - 新荘会Webサイトをrelated_resourcesへ追加
        - 新荘会Webサイト上の2音源をexternal_resourcesへ追加
        - 外部リソースのaccessedおよびconfirmedを記録
      en:
        - Separated the schema and controlled vocabularies into dedicated files
        - Added metadata_model.references
        - Added the Shinso-kai website to related_resources
        - Added two externally hosted audio files to external_resources
        - Recorded accessed and confirmed dates for external resources
  - version: 3.0.0
    date: '2026-07-27'
    changes:
      ja:
        - 制作役割を固定キーとするcreditsセクションを導入
        - 役割名、定義、上位語・関連語を管理するrole_vocabularyセクションを導入
        - プロデューサー、音源制作、CDジャケットデザイン、CD制作のクレジットを追加
        - 歌唱者表記を新荘音頭制作委員、新荘小学校管楽合奏部児童、塙亜樹に統一
        - CDの収録順と制作クレジットをphysical_releasesセクションへ追加
        - 塙亜樹独唱版の識別子およびファイル名のonndoをondoへ訂正
        - 旧contributors配列を役割キー中心の構造へ再編
      en:
        - Introduced a credits section using fixed role identifiers as metadata keys
        - Introduced a role_vocabulary section for preferred labels, definitions, and semantic 
          relations
        - Added credits for producer, audio production, CD jacket design, and CD production
        - Standardized vocalist names as the Shinso Ondo Production Committee, pupils of the Shinso 
          Elementary School Brass Band, and Aki Hanawa
        - Added CD track order and production credits in a physical_releases section
        - Corrected onndo to ondo in the identifier and file name of the Aki Hanawa solo version
        - Reorganized the former contributors array into a role-keyed structure
  - version: "2.0.0"
    date: "2026-07-23"
    changes:
      ja:
        - "正本メタデータ自身のバージョニングを導入"
        - "metadata_modelセクションを追加"
        - "repositoryセクションを追加"
        - "design_principlesセクションを追加"
        - "outputsおよびcrosswalksセクションを追加"
        - "Schema.org JSON-LDへのクロスウォーク実装と検証結果を記録"
      en:
        - "Introduced versioning for the canonical metadata model"
        - "Added the metadata_model section"
        - "Added the repository section"
        - "Added the design_principles section"
        - "Added the outputs and crosswalks sections"
        - "Recorded implementation and validation of the Schema.org JSON-LD crosswalk"

  - version: "1.0.0"
    date: "2026-07-17"
    changes:
      ja:
        - "新荘音頭の作品、歌詞、演奏、権利、典拠を記述するYAMLを作成"
      en:
        - "Created the initial YAML description of the work, lyrics, performances, rights, and sources"

