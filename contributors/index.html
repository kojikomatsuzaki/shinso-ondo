<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="新荘音頭の制作、作詞、作曲、編曲、振付、歌唱、演奏、録音、音楽編集、パンフレット制作およびデジタルアーカイブに関わった人々を紹介します。"
    >

    <title>制作・協力者 | 新荘音頭デジタルアーカイブ</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../homepage-v2.css">
    <script src="../main.js" defer></script>
</head>

<body>
<a class="skip-link" href="#main" data-i18n="skip">本文へ移動</a>
<header class="site-header"><div class="container header-inner"><div class="site-title-block"><p class="eyebrow">Official Digital Archive</p><p class="site-name">新荘音頭</p><p class="subtitle">Shinsō Ondo</p><p class="work-subtitle" data-i18n="workSubtitle">新荘よいとこ散歩道</p></div><div class="header-actions"><button class="language-button" id="language-toggle" type="button" aria-label="Switch to English">English</button><button class="menu-button" id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu"><span class="menu-icon" aria-hidden="true">☰</span><span class="menu-label" data-i18n="menu">メニュー</span></button></div></div></header>
<div class="menu-backdrop" id="menu-backdrop" hidden></div>
<nav class="site-menu" id="site-menu" aria-label="サイト内メニュー" aria-hidden="true" tabindex="-1" data-site-navigation data-site-root="../"></nav>

<header>
    <h1>制作・協力者</h1>
    <p lang="en">Contributors</p>
</header>

<main id="main">

    <p id="loading-message" role="status">
        制作・協力者情報を読み込んでいます。
    </p>

    <div id="contributors-content" hidden>

        <section>
            <h2>制作・企画</h2>
            <div id="planning-list"></div>
        </section>

        <section>
            <h2>作詞・作曲・編曲</h2>
            <div id="music-creation-list"></div>
        </section>

        <section>
            <h2>振付</h2>
            <div id="choreography-list"></div>
        </section>

        <section>
            <h2>歌唱・演奏</h2>
            <div id="performance-list"></div>
        </section>

        <section>
            <h2>録音・音楽編集</h2>
            <div id="audio-production-list"></div>
        </section>

        <section>
            <h2>パンフレット・CD制作</h2>
            <div id="publication-production-list"></div>
        </section>

        <section>
            <h2>デジタルアーカイブ</h2>
            <div id="archive-list"></div>
        </section>

    </div>

    <div id="error-message" role="alert" hidden>
        <h2>情報を表示できませんでした</h2>

        <p>
            メタデータの読み込みまたは解析に失敗しました。
            ページを再読み込みしてください。
        </p>

        <p>
            <a href="../metadata/shinso-ondo.yaml">
                メタデータを直接確認する
            </a>
        </p>
    </div>

</main>

<footer class="site-footer" data-site-footer></footer>

<script src="../js/js-yaml.min.js"></script>

<script>
    "use strict";

    const YAML_PATH = "../metadata/shinso-ondo.yaml";

    const ROLE_LABELS = {
        producer: "制作・プロデュース",
        general_supervision: "総監修",
        originator: "発案",
        lyricist: "作詞",
        composer: "作曲",
        arranger: "編曲",
        choreographer: "振付",
        vocals: "歌唱",
        musician: "演奏",
        conductor: "指揮",
        audio_production: "録音・音楽編集",
        pamphlet_production: "パンフレット制作",
        cd_jacket_design: "CDジャケットデザイン",
        cd_production: "CD制作",
        archive_manager: "デジタルアーカイブ管理"
    };

    function isRedundantNote(role, note) {
        if (!note) {
            return true;
        }

        const roleLabel =
            ROLE_LABELS[role]
            || role
            || "";

        return note.trim() === roleLabel.trim();
    }

    function collectWorkCredits(credits) {
        const contributors = [];

        if (
            !credits
            || typeof credits !== "object"
            || Array.isArray(credits)
        ) {
            return contributors;
        }

        Object.entries(credits).forEach(
            ([role, agents]) => {
                if (!Array.isArray(agents)) {
                    return;
                }

                agents.forEach((agent) => {
                    if (
                        !agent
                        || typeof agent !== "object"
                    ) {
                        return;
                    }

                    contributors.push({
                        ...agent,
                        role: role
                    });
                });
            }
        );

        return contributors;
    }

    function groupContributorsByAgent(contributors) {
        const agents = new Map();

        contributors.forEach((contributor) => {
            const name =
                contributor.name
                || "名称未記録";

            const englishName =
                contributor.name_en
                || "";

            const affiliation =
                contributor.affiliation
                || "";

            const agentKey =
                `${name}|${englishName}|${affiliation}`;

            if (!agents.has(agentKey)) {
                agents.set(agentKey, {
                    name: name,
                    name_en: englishName,
                    affiliation: affiliation,
                    contributions: []
                });
            }

            const agent =
                agents.get(agentKey);

            const role =
                contributor.role
                || "";

            const note =
                contributor.note
                || "";

            const contributionKey =
                `${role}|${note}`;

            const alreadyExists =
                agent.contributions.some(
                    (contribution) =>
                        contribution.key === contributionKey
                );

            if (!alreadyExists) {
                agent.contributions.push({
                    key: contributionKey,
                    role: role,
                    note: note
                });
            }
        });

        return Array.from(agents.values());
    }

    function createContributorElement(agent) {
        const article =
            document.createElement("article");

        article.className = "contributor";

        const heading =
            document.createElement("h3");

        heading.textContent = agent.name;
        article.appendChild(heading);

        if (agent.name_en) {
            const englishName =
                document.createElement("p");

            englishName.className =
                "contributor-name-en";

            englishName.lang = "en";
            englishName.textContent =
                agent.name_en;

            article.appendChild(englishName);
        }

        if (agent.affiliation) {
            const affiliation =
                document.createElement("p");

            affiliation.className =
                "contributor-affiliation";

            affiliation.textContent =
                agent.affiliation;

            article.appendChild(affiliation);
        }

        const roleList =
            document.createElement("ul");

        roleList.className =
            "contributor-roles";

        agent.contributions.forEach(
            (contribution) => {
                const listItem =
                    document.createElement("li");

                const roleLabel =
                    ROLE_LABELS[contribution.role]
                    || contribution.role
                    || "役割未記録";

                listItem.textContent =
                    roleLabel;

                if (
                    contribution.note
                    && !isRedundantNote(
                        contribution.role,
                        contribution.note
                    )
                ) {
                    listItem.append(
                        document.createTextNode(
                            ` — ${contribution.note}`
                        )
                    );
                }

                roleList.appendChild(listItem);
            }
        );

        article.appendChild(roleList);

        return article;
    }

    function appendContributors(
        containerId,
        contributors
    ) {
        const container =
            document.getElementById(containerId);

        container.replaceChildren();

        if (
            !Array.isArray(contributors)
            || contributors.length === 0
        ) {
            const emptyMessage =
                document.createElement("p");

            emptyMessage.textContent =
                "該当する情報は現在登録されていません。";

            container.appendChild(emptyMessage);
            return;
        }

        const groupedContributors =
            groupContributorsByAgent(contributors);

        groupedContributors.forEach((agent) => {
            container.appendChild(
                createContributorElement(agent)
            );
        });
    }

    function byRoles(contributors, roles) {
        return contributors.filter(
            (contributor) =>
                roles.includes(contributor.role)
        );
    }

    async function loadContributors() {
        const loadingMessage =
            document.getElementById(
                "loading-message"
            );

        const contributorsContent =
            document.getElementById(
                "contributors-content"
            );

        const errorMessage =
            document.getElementById(
                "error-message"
            );

        try {
            if (typeof jsyaml === "undefined") {
                throw new Error(
                    "js-yamlライブラリを読み込めませんでした。"
                );
            }

            const response =
                await fetch(YAML_PATH, {
                    cache: "no-cache"
                });

            if (!response.ok) {
                throw new Error(
                    `YAMLの取得に失敗しました: ${response.status}`
                );
            }

            const yamlText =
                await response.text();

            const metadata =
                jsyaml.load(yamlText);

            const workCredits =
                metadata
                && metadata.work
                && metadata.work.credits
                    ? metadata.work.credits
                    : {};

            const workContributors =
                collectWorkCredits(workCredits);

            appendContributors(
                "planning-list",
                byRoles(
                    workContributors,
                    [
                        "producer",
                        "general_supervision",
                        "originator"
                    ]
                )
            );

            appendContributors(
                "music-creation-list",
                byRoles(
                    workContributors,
                    [
                        "lyricist",
                        "composer",
                        "arranger"
                    ]
                )
            );

            appendContributors(
                "choreography-list",
                byRoles(
                    workContributors,
                    [
                        "choreographer"
                    ]
                )
            );

            appendContributors(
                "performance-list",
                byRoles(
                    workContributors,
                    [
                        "vocals",
                        "musician",
                        "conductor"
                    ]
                )
            );

            appendContributors(
                "audio-production-list",
                byRoles(
                    workContributors,
                    [
                        "audio_production"
                    ]
                )
            );

            appendContributors(
                "publication-production-list",
                byRoles(
                    workContributors,
                    [
                        "pamphlet_production",
                        "cd_jacket_design",
                        "cd_production"
                    ]
                )
            );

            appendContributors(
                "archive-list",
                byRoles(
                    workContributors,
                    [
                        "archive_manager"
                    ]
                )
            );

            loadingMessage.hidden = true;
            errorMessage.hidden = true;
            contributorsContent.hidden = false;

        } catch (error) {
            console.error(
                "制作・協力者情報の表示に失敗しました。",
                error
            );

            loadingMessage.hidden = true;
            contributorsContent.hidden = true;
            errorMessage.hidden = false;
        }
    }

    loadContributors();
</script>

</body>
</html>
